version: '3.8'

services:
  # Frontend React service (pre-prod)
  frontend:
    image: web_ui_frontend:preprod  # Локальный prod-образ
    container_name: web_ui_service-frontend-preprod
    ports:
      - "8350:80"
    depends_on:
      - backend
    networks:
      - web_ui_network_preprod

  # Backend FastAPI service (pre-prod)
  backend:
    image: web_ui_backend:preprod  # Локальный prod-образ
    container_name: web_ui_service-backend-preprod
    ports:
      - "8351:8351"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=preproduction
      - BACKEND_PORT=8351
      - AGENT_SERVICE_URL=http://agent_preprod:8250
      - ALLOWED_ORIGINS=http://localhost:8350,http://web_ui_service-frontend-preprod:80
      - WS_TOKEN=preprod_token_123
      - SETTINGS_FILE=app_settings-prod.json
    networks:
      - web_ui_network_preprod

networks:
  web_ui_network_preprod:
    driver: bridge
    name: web_ui_network_preprod

volumes:
  frontend-data:
  frontend-react-data: