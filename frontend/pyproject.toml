[project]
name = "web-ui-frontend"
version = "1.0.0"
description = "Frontend service for lifelong learning assistant web UI"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kilo Code", email = "dev@example.com"}
]

dependencies = [
    "nicegui>=1.5.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.1.0",
    "markdown>=3.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
# Если нужно добавить локальные пакеты, можно указать здесь

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
