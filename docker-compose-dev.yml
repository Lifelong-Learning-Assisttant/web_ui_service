version: '3.8'

services:
  # Backend FastAPI service (существующий)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-dev
    container_name: web_ui_service-backend-dev
    ports:
      - "8151:8151"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests_integration
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - BACKEND_PORT=8151
      - AGENT_SERVICE_URL=http://agent-service:8270
      - ALLOWED_ORIGINS=http://localhost:8150,http://web-frontend:80
      - WS_TOKEN=dev_token_123
      - SETTINGS_FILE=app_settings-dev.json
    networks:
      web_ui_network:
        aliases:
          - web-backend

  # Frontend React service (новый)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-dev
    container_name: web_ui_service-frontend-dev
    ports:
      - "8150:80"
    depends_on:
      - backend
    networks:
      web_ui_network:
        aliases:
          - web-frontend

networks:
  web_ui_network:
    name: web_ui_network

volumes:
  frontend-data:
  frontend-react-data:
