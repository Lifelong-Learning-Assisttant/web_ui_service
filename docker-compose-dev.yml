version: '3.8'

services:
  # Backend FastAPI service (существующий)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-dev
    container_name: web_ui_service-backend-dev
    ports:
      - "8351:8351"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests_integration
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - BACKEND_PORT=8351
      - AGENT_SERVICE_URL=http://agent_dev:8250
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080,http://localhost:8350,http://web_ui_service-frontend-dev:80
      - WS_TOKEN=dev_token_123
      - SETTINGS_FILE=app_settings-dev.json
    networks:
      web_ui_network_dev:
        aliases:
          - web_ui_back-dev

  # Frontend React service (новый)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-dev
    container_name: web_ui_service-frontend-dev
    ports:
      - "8350:80"
    depends_on:
      - backend
    networks:
      web_ui_network_dev:
        aliases:
          - web_ui_front-dev

networks:
  web_ui_network_dev:
    driver: bridge
    name: web_ui_network_dev

volumes:
  frontend-data:
  frontend-react-data:
