version: '3.8'

services:
  web_ui_dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "8350:8350"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - internal_network
      - rag_network
      - test_generator_network
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_SERVICE_URL=http://agent_service:8250
    command: uv run python web_ui.py --settings app_settings-dev.json

networks:
  internal_network:
    driver: bridge
    name: web_ui_internal_network
  rag_network:
    external: true
    name: rag_rag_network
  test_generator_network:
    external: true
    name: llm_tester_default